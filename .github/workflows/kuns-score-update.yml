name: Kuns Score Update

on:
  repository_dispatch:
    types: [kuns-score-update]

jobs:
  update-score:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update Kuns score in index.html
        env:
          SCORE: ${{ github.event.client_payload.score }}
          TOTAL: ${{ github.event.client_payload.total }}
          PASSED: ${{ github.event.client_payload.passed }}
          DATUM: ${{ github.event.client_payload.datum }}
        run: |
          python3 - <<'PYEOF'
          import os, re

          score = os.environ['SCORE']
          total = os.environ['TOTAL']
          passed = os.environ['PASSED']
          datum = os.environ['DATUM']
          badge = "✅ Geslaag" if passed == "true" else "❌ Gedruip — Probeer weer"
          badge_class = "geslaag" if passed == "true" else "gedruip"
          score_block = f'<div id="kuns-toets-uitslag" class="toets-uitslag {badge_class}">Kuns Toets | Punte: {score}/{total} | Datum: {datum} | {badge}</div>'

          with open('index.html', 'r', encoding='utf-8') as f:
              html = f.read()

          # Remove old score block if exists
          html = re.sub(r'<div id="kuns-toets-uitslag"[^>]*>.*?</div>', '', html, flags=re.DOTALL)

          # Inject before the closing </div> of the kuns tab section
          kuns_pattern = r'(id="kuns".*?<ul>.*?</ul>\s*</div>\s*)(</div>)'
          replacement = r'\g<1>' + score_block + r'\n\g<2>'
          html = re.sub(kuns_pattern, replacement, html, flags=re.DOTALL)

          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(html)
          print("Score injected successfully.")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "kuns: update toets uitslag ${{ github.event.client_payload.score }}/${{ github.event.client_payload.total }}"
          git push
